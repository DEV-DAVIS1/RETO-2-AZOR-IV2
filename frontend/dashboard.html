<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Consulta Ad Astra</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.9.0/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.9.0/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F3F6F9; --ink:#101C2B; --muted:#5B6B7E;
  --line:#D5DCE4; --accent:#0B5FA5; --accent-ink:#FFFFFF; --signal:#E8A317; --dino:#3FA36B; --dino2:#2E8555;
  --bubble-user:#0B5FA5; --bubble-user-ink:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A121C; --surface:#111C2A; --surface2:#0D1622; --ink:#E6EDF5; --muted:#8FA1B5;
    --line:#22324A; --accent:#4FA3E8; --accent-ink:#06121F; --signal:#F0B43A; --dino:#4CC083; --dino2:#38a06b;
    --bubble-user:#1D4F7E; --bubble-user-ink:#E6EDF5;
  }
}
:root[data-theme="dark"]{
  --bg:#0A121C; --surface:#111C2A; --surface2:#0D1622; --ink:#E6EDF5; --muted:#8FA1B5;
  --line:#22324A; --accent:#4FA3E8; --accent-ink:#06121F; --signal:#F0B43A; --dino:#4CC083; --dino2:#38a06b;
  --bubble-user:#1D4F7E; --bubble-user-ink:#E6EDF5;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:16px}
.app{max-width:1280px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--signal)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:14px}
@media (max-width:820px){main{grid-template-columns:1fr;grid-auto-rows:minmax(420px,auto)}.app{height:auto}html,body{height:auto}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-h{padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
/* chat */
#log{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:9px 12px;border-radius:6px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--bubble-user);color:var(--bubble-user-ink)}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
.msg.bot .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:6px}
.msg.bot .srcs{margin-top:8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;white-space:normal}
.msg.wait{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px}
.msg.wait p{margin:0;color:var(--muted)}
.msg.wait b{color:var(--ink);font-weight:600}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface)}
textarea{flex:1;resize:none;height:44px;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea:focus,button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.send{font:600 13px var(--f-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:0 18px;cursor:pointer}
.send:disabled{opacity:.5;cursor:wait}
/* dino */
.dino{width:84px;height:70px;flex:none;overflow:visible}
.dino .flip{transform-box:fill-box;transform-origin:50% 55%;animation:flip 1.3s cubic-bezier(.45,.05,.55,.95) infinite}
.dino .shadow{transform-box:fill-box;transform-origin:center;animation:sh 1.3s ease-in-out infinite}
@keyframes flip{0%{transform:translateY(0) rotate(0)}18%{transform:translateY(4px) rotate(0) scale(1,.92)}55%{transform:translateY(-22px) rotate(200deg)}85%{transform:translateY(0) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes sh{0%,100%{transform:scale(1);opacity:.35}55%{transform:scale(.55);opacity:.15}}
@media (prefers-reduced-motion:reduce){.dino .flip,.dino .shadow{animation:none}}
/* viz */
.tabs{display:flex;gap:4px}
.tab{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:none;color:var(--muted);border:1px solid transparent;border-radius:4px;padding:5px 10px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:var(--surface2)}
.viz{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0}
[hidden]{display:none!important}
#map,#map.maplibregl-map{position:absolute;inset:0;background:#04040A}
#map .maplibregl-canvas{outline:none}
.mode{position:absolute;left:10px;top:10px;z-index:5;font:11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#9CC9F0;background:rgba(6,14,24,.75);border:1px solid #2B4966;border-radius:4px;padding:3px 8px}
.coords{position:absolute;left:10px;bottom:10px;z-index:5;font:11px var(--f-mono);background:rgba(6,14,24,.75);color:#9CC9F0;border:1px solid #2B4966;border-radius:4px;padding:3px 8px;font-variant-numeric:tabular-nums}
.attr{position:absolute;right:6px;bottom:4px;z-index:5;font-size:10px;color:#9CC9F0;background:rgba(6,14,24,.75);padding:0 4px;border-radius:3px}
.pinel{width:30px;height:30px;cursor:pointer;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.pinel svg{width:100%;height:100%}
.maplibregl-popup-content{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-family:var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:230px}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--surface)}
.maplibregl-popup-close-button{color:var(--muted);font-size:18px;padding:2px 8px}
.popup h3{margin:0 22px 4px 0;font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.15}
.popup dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.popup dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.popup dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tab .n:not(:empty){font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 5px;margin-left:3px}
.scroll{overflow:auto;padding:16px;background:var(--surface)}
.scroll h2{margin:0 0 8px;font-family:var(--f-display);font-size:20px;font-weight:600;text-wrap:balance}
.scroll svg{width:100%;height:auto;max-height:60vh;display:block}
.scroll .note,.empty2{color:var(--muted);font-size:13px;max-width:62ch}
.empty2{padding:24px 4px}
.ax{font:10px var(--f-mono);fill:var(--muted)}
.ev{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;background:var(--surface2)}
.ev.hl{outline:2px solid var(--signal)}
.ev header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
.ev p{margin:0;font-size:13px}
.mono{font-family:var(--f-mono);font-size:11px}.muted{color:var(--muted)}
.chip{font:11px var(--f-mono);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--accent)}
.cite{font:600 10px var(--f-mono);background:none;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:0 5px;margin:0 2px;cursor:pointer;vertical-align:baseline}
.msg .txt{white-space:pre-wrap}
.msg.err{border-color:#D9412B}
.msg code{font-family:var(--f-mono);font-size:12px}
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font:12px var(--f-mono);color:#9CC9F0;background:rgba(6,14,24,.8);border:1px solid #2B4966;border-radius:4px;padding:6px 12px}
.dot{border-radius:50%;background:rgba(232,163,23,.45);border:2px solid #E8A317;cursor:pointer}
</style>

<div class="app">
  <header>
    <h1>Consulta <span>Ad Astra</span></h1>
    <div class="status"><span class="dot"></span>agentes reales · orquestador → redactor / comparador / visualizador</div>
  </header>
  <main>
    <section class="panel" aria-label="Chat">
      <div class="panel-h"><span>Consulta</span><span id="count">0 preguntas</span></div>
      <div id="log" aria-live="polite"></div>
      <form id="f">
        <textarea id="q" rows="1" placeholder="Escribe tu pregunta… (o «muéstrame un mapa de…», «grafica…»)" aria-label="Pregunta"></textarea>
        <button class="send" id="send" type="submit">Enviar</button>
      </form>
    </section>
    <section class="panel" aria-label="Visualización">
      <div class="panel-h">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="t-map" aria-selected="true" data-tab="map">Mapa <span class="n" id="n-map"></span></button>
          <button class="tab" role="tab" id="t-graf" aria-selected="false" data-tab="graf">Gráfico</button>
          <button class="tab" role="tab" id="t-evid" aria-selected="false" data-tab="evid">Evidencia <span class="n" id="n-evid"></span></button>
        </div>
        <span id="vizlabel">ubicación</span>
      </div>
      <div class="viz">
        <div class="pane" id="map" role="tabpanel" aria-labelledby="t-map">
          <div class="mode">Osiris · globo · semi-satelital</div>
          <div class="empty" id="mapempty">Sin ubicaciones en esta respuesta</div>
          <div class="coords" id="coords"></div>
          <div class="attr">© CARTO · Imágenes © Esri, Maxar, Earthstar Geographics · © MapLibre</div>
        </div>
        <div class="pane scroll" id="grafico" role="tabpanel" aria-labelledby="t-graf" hidden></div>
        <div class="pane scroll" id="evid" role="tabpanel" aria-labelledby="t-evid" hidden></div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
  var log=document.getElementById('log'), form=document.getElementById('f'), q=document.getElementById('q'),
      send=document.getElementById('send'), count=document.getElementById('count');
  var asked=0;

  var DINO='<svg class="dino" viewBox="0 0 120 100" role="img" aria-label="Dinosaurio haciendo piruetas">'+
    '<ellipse class="shadow" cx="60" cy="94" rx="30" ry="4" fill="#000"/>'+
    '<g class="flip">'+
      '<polygon points="30,52 4,70 8,44 30,42" fill="var(--dino2)"/>'+
      '<ellipse cx="56" cy="54" rx="28" ry="20" fill="var(--dino)"/>'+
      '<polygon points="40,36 46,24 52,36" fill="var(--signal)"/><polygon points="52,34 58,20 64,34" fill="var(--signal)"/><polygon points="64,36 70,24 76,38" fill="var(--signal)"/>'+
      '<path d="M76 46 Q90 44 94 30 Q94 20 104 22 Q116 24 114 34 Q112 42 102 42 Q98 52 84 62 Z" fill="var(--dino)"/>'+
      '<circle cx="104" cy="28" r="3.2" fill="#fff"/><circle cx="105" cy="28" r="1.5" fill="#101C2B"/>'+
      '<path d="M100 37 Q106 39 111 36" stroke="#101C2B" stroke-width="1.6" fill="none" stroke-linecap="round"/>'+
      '<rect x="44" y="68" width="9" height="16" rx="3" fill="var(--dino2)"/><rect x="64" y="68" width="9" height="16" rx="3" fill="var(--dino2)"/>'+
      '<path d="M78 58 l8 4" stroke="var(--dino2)" stroke-width="5" stroke-linecap="round"/>'+
    '</g></svg>';

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function add(cls,html){var d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}

  /* ---- Conexión con el backend (servidor.py) ---- */
  var API=(new URLSearchParams(location.search).get('api')||window.CODEFEST_API||'http://localhost:8000').replace(/\/$/,'');
  var DEMO=new URLSearchParams(location.search).has('demo');
  var lastDocs=[];
  function consulta(pregunta){
    if(DEMO)return mock(pregunta);
    var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},180000);
    return fetch(API+'/consulta',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
      body:JSON.stringify({pregunta:pregunta,doc_ids:lastDocs})})
      .then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
  }
  function mock(q){ /* solo con ?demo */
    return new Promise(function(res){setTimeout(function(){res({rama:'redactor',fenomenos:[3],respuesta:'Respuesta de ejemplo (modo demo).',
      puntos:[{nombre:'Colombia',lat:4.57,lon:-74.3,valor:42,doc_ids:['F3-DEMO-001']},{nombre:'Venezuela',lat:6.42,lon:-66.6,valor:18,doc_ids:['F3-DEMO-002']}],
      grafico:null,evidencia:[{doc_id:'F3-DEMO-001',chunk_id:'demo_1',fenomeno:3,texto:'Fragmento de ejemplo.'}],metadata:{tokens:{total:0},latencia_ms:0}})},2400)});
  }

  /* ---- Mapa estilo OSIRIS: MapLibre globo + CARTO Dark Matter + Esri World Imagery (opacidad .85) ---- */
  var coords=document.getElementById('coords'), mp=null, markers=[], mapReady=false, pending=null, empty=document.getElementById('mapempty');
  function initMap(){
    if(mp||!window.maplibregl)return;
    mp=new maplibregl.Map({container:'map',style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center:[-74,4.6],zoom:1.6,minZoom:1.5,maxZoom:18,attributionControl:false,maxPitch:85});
    mp.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
    mp.on('style.load',function(){
      try{mp.setProjection({type:'globe'})}catch(e){}
      try{mp.setSky({'sky-color':'#04040A','sky-horizon-blend':.5,'horizon-color':'#0B1A2C','horizon-fog-blend':.3,'fog-color':'#04040A','fog-ground-blend':.9})}catch(e){}
      mp.addSource('satellite-tiles',{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:18});
      var first=(mp.getStyle().layers.filter(function(l){return l.type==='symbol'})[0]||{}).id;
      mp.addLayer({id:'satellite-layer',type:'raster',source:'satellite-tiles',paint:{'raster-opacity':.85}},first);
      mapReady=true;if(pending){showPoints(pending);pending=null}
    });
    mp.on('move',function(){var c=mp.getCenter();coords.textContent=c.lat.toFixed(4)+'°, '+c.lng.toFixed(4)+'° · z'+mp.getZoom().toFixed(1)});
  }
  function pinSvg(){return '<svg viewBox="0 0 24 24"><path d="M12 22s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z" fill="#D9412B"/><circle cx="12" cy="10" r="2.8" fill="#fff"/></svg>'}
  function popupHtml(p){
    var docs=(p.doc_ids||[]).slice(0,4).map(esc).join(', ');
    return '<div class="popup"><h3>'+esc(p.nombre)+'</h3><dl><dt>Lat</dt><dd>'+(+p.lat).toFixed(4)+'°</dd><dt>Lon</dt><dd>'+(+p.lon).toFixed(4)+'°</dd>'+
      (p.valor?'<dt>Menciones</dt><dd>'+esc(p.valor)+'</dd>':'')+(docs?'<dt>Docs</dt><dd>'+docs+'</dd>':'')+'</dl></div>';
  }
  function showPoints(pts){
    if(!mapReady){pending=pts;return}
    markers.forEach(function(m){m.remove()});markers=[];
    empty.hidden=pts.length>0;
    if(!pts.length)return;
    var max=Math.max.apply(null,pts.map(function(p){return p.valor||1})),single=pts.length===1,b=new maplibregl.LngLatBounds();
    pts.forEach(function(p){
      var el=document.createElement('div');
      if(single){el.className='pinel';el.innerHTML=pinSvg()}
      else{var d=10+26*Math.sqrt((p.valor||1)/max);el.className='dot';el.style.width=el.style.height=d+'px'}
      var pop=new maplibregl.Popup({offset:single?[0,-30]:[0,-8],closeButton:true,closeOnClick:false,maxWidth:'280px'}).setHTML(popupHtml(p));
      var mk=new maplibregl.Marker({element:el,anchor:single?'bottom':'center'}).setLngLat([+p.lon,+p.lat]).setPopup(pop).addTo(mp);
      markers.push(mk);b.extend([+p.lon,+p.lat]);
    });
    if(single){mp.flyTo({center:[+pts[0].lon,+pts[0].lat],zoom:11.5,pitch:35,duration:2400});mp.once('moveend',function(){markers[0].togglePopup()})}
    else mp.fitBounds(b,{padding:70,maxZoom:6,duration:2200,pitch:0});
  }
  function drawMap(){if(mp)mp.resize()}
  initMap();

  /* ---- Gráfico (SVG) ---- */
  var W=640,H=360;
  function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v||1))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
  function chartLinea(d){
    if(!d.length)return '';
    var m=niceMax(Math.max.apply(null,d.map(function(x){return x.valor}))),l=48,r=16,t=20,b=44,pw=W-l-r,ph=H-t-b,bw=pw/d.length,s='';
    for(var i=0;i<=4;i++){var y=t+ph-ph*i/4;s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(l-8)+'" y="'+(y+4)+'" text-anchor="end" class="ax">'+Math.round(m*i/4)+'</text>'}
    d.forEach(function(x,i){var h=ph*x.valor/m,X=l+i*bw+bw*.15,Y=t+ph-h;
      s+='<rect x="'+X+'" y="'+Y+'" width="'+bw*.7+'" height="'+h+'" rx="2" fill="var(--accent)"><title>'+esc(x.periodo)+': '+x.valor+'</title></rect>'+
         '<text x="'+(X+bw*.35)+'" y="'+(Y-5)+'" text-anchor="middle" class="ax">'+x.valor+'</text>'+
         '<text x="'+(X+bw*.35)+'" y="'+(H-t-8+8)+'" text-anchor="middle" class="ax">'+esc(x.periodo)+'</text>'});
    return s;
  }
  function chartMatriz(d){
    if(!d.length)return '';
    var filas=[],cols=[],val={},max=1;
    d.forEach(function(x){if(filas.indexOf(x.fila)<0)filas.push(x.fila);if(cols.indexOf(x.columna)<0)cols.push(x.columna);val[x.fila+'|'+x.columna]=x.valor;max=Math.max(max,x.valor)});
    var l=140,t=56,cw=(W-l-16)/cols.length,rh=Math.min(22,(H-t-8)/filas.length),s='';
    cols.forEach(function(c,j){s+='<text x="'+(l+j*cw+cw/2)+'" y="'+(t-10)+'" text-anchor="middle" class="ax">'+esc(c.length>26?c.slice(0,25)+'…':c)+'</text>'});
    filas.forEach(function(f,i){
      s+='<text x="'+(l-8)+'" y="'+(t+i*rh+rh*.68)+'" text-anchor="end" class="ax">'+esc(f)+'</text>';
      cols.forEach(function(c,j){var v=val[f+'|'+c]||0;
        s+='<rect x="'+(l+j*cw+1)+'" y="'+(t+i*rh+1)+'" width="'+(cw-2)+'" height="'+(rh-2)+'" rx="2" fill="var(--accent)" fill-opacity="'+(.08+.9*v/max)+'"><title>'+esc(f)+' · '+esc(c)+': '+v+'</title></rect>'+
           (v?'<text x="'+(l+j*cw+cw/2)+'" y="'+(t+i*rh+rh*.68)+'" text-anchor="middle" class="ax" style="fill:var(--ink)">'+v+'</text>':'')});
    });
    return s;
  }
  function chartRed(g){
    var n=g.nodos||[];if(!n.length)return '';
    var cx=W/2,cy=H/2,R=Math.min(W,H)/2-64,pos={},max=Math.max.apply(null,n.map(function(x){return x.valor}))||1,s='';
    n.forEach(function(x,i){var a=2*Math.PI*i/n.length-Math.PI/2;pos[x.id]=[cx+R*Math.cos(a),cy+R*Math.sin(a),a]});
    var mw=Math.max.apply(null,(g.aristas||[]).map(function(e){return e.peso}).concat([1]));
    (g.aristas||[]).forEach(function(e){var a=pos[e.origen],b=pos[e.destino];if(a&&b)s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="var(--accent)" stroke-opacity=".35" stroke-width="'+(.6+3*e.peso/mw)+'"><title>'+esc(e.origen)+' – '+esc(e.destino)+': '+e.peso+' docs</title></line>'});
    n.forEach(function(x){var p=pos[x.id],r=4+9*Math.sqrt(x.valor/max),ca=Math.cos(p[2]);
      s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="var(--signal)"><title>'+esc(x.id)+': '+x.valor+'</title></circle>'+
         '<text x="'+(p[0]+(r+5)*ca)+'" y="'+(p[1]+(r+5)*Math.sin(p[2])+4)+'" text-anchor="'+(ca>.2?'start':ca<-.2?'end':'middle')+'" class="ax">'+esc(x.id)+'</text>'});
    return s;
  }
  function showGrafico(g){
    var el=document.getElementById('grafico'),body='';
    if(g&&g.datos&&(Array.isArray(g.datos)?g.datos.length:(g.datos.nodos||[]).length)){
      if(g.componente==='linea_tiempo')body=chartLinea(g.datos);
      else if(g.componente==='matriz_calor')body=chartMatriz(g.datos);
      else if(g.componente==='red_coocurrencia')body=chartRed(g.datos);
    }
    if(!body){el.innerHTML='<div class="empty2">'+(g&&g.explicacion?esc(g.explicacion):'Pide un gráfico para verlo aquí. Ej.: «Grafica cuántos documentos hay por año sobre basura espacial».')+'</div>';return false}
    el.innerHTML='<h2>'+esc(g.titulo)+'</h2><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(g.titulo)+'">'+body+'</svg><p class="note">'+esc(g.explicacion||'')+'</p>';
    return true;
  }

  /* ---- Evidencia ---- */
  var FEN={1:'IA militar',2:'Espacio',3:'LATAM'};
  function showEvidencia(list){
    var el=document.getElementById('evid');
    if(!list.length){el.innerHTML='<div class="empty2">Aquí aparecen los fragmentos que sustentan cada respuesta.</div>';return}
    el.innerHTML=list.map(function(e){return '<article class="ev" id="ev-'+esc(e.chunk_id)+'"><header><span class="mono">'+esc(e.doc_id)+'</span>'+(e.fenomeno?'<span class="chip">'+esc(FEN[e.fenomeno]||('F'+e.fenomeno))+'</span>':'')+'<span class="mono muted">'+esc(e.chunk_id||'')+'</span></header><p>'+esc(e.texto)+'</p></article>'}).join('');
  }

  /* ---- Pestañas ---- */
  var TABS={map:'ubicación',graf:'gráfico',evid:'evidencia'};
  function tab(name){
    ['map','graf','evid'].forEach(function(k){
      var pane=document.getElementById(k==='map'?'map':k==='graf'?'grafico':'evid');pane.hidden=k!==name;
      document.getElementById('t-'+k).setAttribute('aria-selected',k===name);
    });
    document.getElementById('vizlabel').textContent=TABS[name];
    if(name==='map')setTimeout(drawMap,0);
  }
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab(b.dataset.tab)}});

  /* ---- Mensajes ---- */
  /* Las citas llegan como [1], [2]... y apuntan al `indice` de r.fuentes. */
  function fmt(t,fuentes){
    var porIndice={};(fuentes||[]).forEach(function(f){porIndice[f.indice]=f});
    return esc(t).replace(/\[(\d{1,2})\]/g,function(marca,n){
      var f=porIndice[n];if(!f)return marca;
      return '<button type="button" class="cite" data-c="'+esc((f.chunk_ids||[]).join(' '))+'" title="'+esc(f.etiqueta+(f.doc_id_oficial?' · '+f.doc_id_oficial:''))+'">'+n+'</button>';
    }).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  }
  /* Lista de fuentes bajo la respuesta; cada marca abre sus fragmentos en Evidencia. */
  function srcList(fuentes){
    if(!(fuentes||[]).length)return '';
    return '<div class="srcs">'+fuentes.map(function(f){
      return '<div>'+fmt('['+f.indice+']',fuentes)+' '+esc(f.referencia||f.etiqueta)+'</div>';
    }).join('')+'</div>';
  }
  function metaLine(r){
    var m=r.metadata||{},t=(m.tokens&&m.tokens.total)||0,ms=m.latencia_total_ms||m.latencia_ms||0;
    return esc(r.rama)+(r.fenomenos&&r.fenomenos.length?' · F'+r.fenomenos.join('+F'):'')+(t?' · '+t+' tok':'')+(ms?' · '+(ms/1000).toFixed(1)+' s':'');
  }
  log.addEventListener('click',function(e){
    var c=e.target.closest('.cite');if(!c)return;tab('evid');
    // Una fuente puede respaldar varias afirmaciones: se resaltan todos sus fragmentos.
    c.dataset.c.split(' ').forEach(function(id,i){
      var el=document.getElementById('ev-'+id);if(!el)return;
      if(i===0)el.scrollIntoView({block:'center'});
      el.classList.add('hl');setTimeout(function(){el.classList.remove('hl')},1800);
    });
  });
  function aplicar(r){
    var pts=(r.puntos||[]).filter(function(p){return p.lat!=null&&p.lon!=null});
    showPoints(pts);
    var hayGraf=showGrafico(r.grafico);
    showEvidencia(r.evidencia||[]);
    lastDocs=(r.evidencia||[]).map(function(e){return e.doc_id}).filter(function(v,i,a){return a.indexOf(v)===i}).slice(0,12);
    document.getElementById('n-map').textContent=pts.length||'';
    document.getElementById('n-evid').textContent=(r.evidencia||[]).length||'';
    tab(hayGraf?'graf':pts.length?'map':(r.evidencia&&r.evidencia.length)?'evid':'map');
  }

  /* ---- Envío ---- */
  function ask(text){
    asked++;count.textContent=asked+(asked===1?' pregunta':' preguntas');
    add('user',esc(text));
    send.disabled=true;
    var w=add('bot wait',DINO+'<p><b>Pensando…</b><br><span id="slow">el dinosaurio está en ello</span></p>');
    var slow=setTimeout(function(){var s=document.getElementById('slow');if(s)s.textContent='los agentes siguen trabajando…'},9000);
    consulta(text).then(function(r){
      w.className='msg bot';w.innerHTML='<div class="txt">'+fmt(r.respuesta||'',r.fuentes)+'</div>'+srcList(r.fuentes)+'<div class="meta">'+metaLine(r)+'</div>';
      aplicar(r);
    }).catch(function(err){
      w.className='msg bot err';
      w.innerHTML='No pude conectar con el servidor ('+esc(API)+'). Revisa que <code>uvicorn servidor:app --port 8000</code> esté corriendo. <div class="meta">'+esc(String(err.message||err))+'</div>';
    }).then(function(){clearTimeout(slow);send.disabled=false;log.scrollTop=log.scrollHeight;q.focus()});
  }
  form.onsubmit=function(e){e.preventDefault();var t=q.value.trim();if(!t||send.disabled)return;q.value='';ask(t)};
  q.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});

  /* ---- Estado inicial ---- */
  add('bot','Hola. Pregúntame sobre IA en entornos militares, seguridad espacial u órbita baja, o dinámicas territoriales en LATAM. Puedo responder con citas, comparar fenómenos, o pedirte un mapa o gráfico.<div class="meta">conectado a '+esc(API)+(DEMO?' · modo demo':'')+'</div>');
  showGrafico(null);showEvidencia([]);showPoints([]);
})();
</script>
</body></html>
